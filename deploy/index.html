    // ==========================================
    // 2. PHASE 2 DETERMINISTIC PHYSICS ENGINE
    // ==========================================

    function validateInputs(inputs) {
      const errs = [];
      if (!inputs.lengthM || inputs.lengthM <= 0) errs.push('Length must be greater than 0.');
      if (!inputs.widthM || inputs.widthM <= 0) errs.push('Width must be greater than 0.');
      if (!inputs.heightM || inputs.heightM <= 0) errs.push('Height must be greater than 0.');
      if (inputs.windowAreaM2 < 0) errs.push('Window area must be >= 0.');
      const gross = 2 * inputs.lengthM * inputs.heightM + 2 * inputs.widthM * inputs.heightM;
      if (inputs.windowAreaM2 > gross) errs.push(`Window area (${inputs.windowAreaM2}m²) cannot exceed gross wall area (${gross.toFixed(1)}m²).`);
      if (inputs.occupants < 0) errs.push('Occupants must be >= 0.');
      return errs;
    }

    function runDeterministicSimulation(inputs) {
      const L = Math.max(0.1, inputs.lengthM);
      const W = Math.max(0.1, inputs.widthM);
      const H = Math.max(0.1, inputs.heightM);

      // Section 3: Geometry
      const A_floor = L * W;
      const V = L * W * H;
      const A_wall_gross = 2 * L * H + 2 * W * H;
      const A_window = Math.min(Math.max(0, inputs.windowAreaM2), A_wall_gross * 0.95);
      const A_wall = Math.max(0, A_wall_gross - A_window);
      const A_roof = L * W;

      // Section 4: Thermal Resistance & U-Values
      const wallMat = WALL_MATERIALS[inputs.wallMaterialId] || WALL_MATERIALS.rammed_earth;
      const roofMat = ROOF_MATERIALS[inputs.roofMaterialId] || ROOF_MATERIALS.traditional_mud_timber;
      const insGrade = INSULATION_GRADES[inputs.insulationLevel] || INSULATION_GRADES.Medium;
      const glazing = GLAZING_OPTIONS[inputs.glazingTypeId] || GLAZING_OPTIONS.double_clear;

      const R_wall = 0.13 + (wallMat.thicknessM / wallMat.thermalConductivityK) + (insGrade.thicknessM / insGrade.thermalConductivityK) + 0.04;
      const U_wall = 1 / R_wall;

      const R_roof = 0.10 + (roofMat.thicknessM / roofMat.thermalConductivityK) + (insGrade.thicknessM / insGrade.thermalConductivityK) + 0.04;
      const U_roof = 1 / R_roof;

      const R_floor = 0.17 + 1.80; // Ground slab
      const U_floor = 1 / R_floor;
      const U_window = glazing.uValueWm2K;

      // Section 12: Thermal Mass Capacitance
      const cMass = CENTRAL_ASSUMPTIONS.thermalMassCapacitancePerM2Floor[inputs.thermalMassLevel]?.value || 250000;
      const C = (A_floor * cMass) + (V * 0.88 * 1005);

      // Section 10: Ventilation ACH
      const ach = CENTRAL_ASSUMPTIONS.achMapping[inputs.airLeakageLevel]?.value || 1.5;
      const Vdot = (ach * V) / 3600; // m³/s

      // Section 11: Internal Heat Gain
      const Q_internal = Math.max(0, inputs.occupants) * 100; // 100 W/person

      // Section 14: Initial Indoor Temp
      let Tin = CENTRAL_ASSUMPTIONS.initialIndoorTemperature.value; // -5.0°C
      const dt = 3600; // 1 hour step

      const fOrient = CENTRAL_ASSUMPTIONS.orientationFactors[inputs.orientation]?.value || 0.5;

      const hourlyData = [];
      let sumIndoor = 0, minIndoor = Infinity, maxIndoor = -Infinity;
      let sumOutdoor = 0, minOutdoor = Infinity, maxOutdoor = -Infinity;
      let totalSolarJ = 0, totalLossJ = 0, maxHourlyLossW = 0;
      let sumWallLossW = 0, sumRoofLossW = 0, sumFloorLossW = 0, sumWinLossW = 0, sumVentLossW = 0;

      for (let h = 0; h < 24; h++) {
        const clim = LEH_LADAKH_HOURLY_CLIMATE[h];
        const Tout = clim.outdoorTempC;
        const G = clim.globalHorizontalSolarWm2;

        if (Tout < minOutdoor) minOutdoor = Tout;
        if (Tout > maxOutdoor) maxOutdoor = Tout;
        sumOutdoor += Tout;

        // Section 5, 6, 7, 8: Heat Losses
        const Q_wall = U_wall * A_wall * (Tin - Tout);
        const Q_roof = U_roof * A_roof * (Tin - Tout);
        const Q_floor = U_floor * A_floor * (Tin - 5.0); // Tground = 5°C
        const Q_window = U_window * A_window * (Tin - Tout);
        // Section 10: Ventilation Loss
        const Q_vent = 0.88 * 1005 * Vdot * (Tin - Tout);

        // Section 9: Solar Gain
        const Q_solar = G * A_window * glazing.shgc * fOrient;

        const totalGain = Q_solar + Q_internal;
        const totalLoss = Q_wall + Q_roof + Q_floor + Q_window + Q_vent;
        const netHeatFlow = totalGain - totalLoss;

        if (totalLoss > maxHourlyLossW) maxHourlyLossW = totalLoss;
        totalSolarJ += Q_solar * dt;
        totalLossJ += Math.max(0, totalLoss) * dt;

        sumWallLossW += Math.max(0, Q_wall);
        sumRoofLossW += Math.max(0, Q_roof);
        sumFloorLossW += Math.max(0, Q_floor);
        sumWinLossW += Math.max(0, Q_window);
        sumVentLossW += Math.max(0, Q_vent);

        const roundedTin = Math.round(Tin * 10) / 10;
        sumIndoor += roundedTin;
        if (roundedTin < minIndoor) minIndoor = roundedTin;
        if (roundedTin > maxIndoor) maxIndoor = roundedTin;

        hourlyData.push({
          hour: clim.hour,
          timeLabel: clim.timeLabel,
          outdoorTempC: Math.round(Tout * 10) / 10,
          solarIrradianceWm2: Math.round(G),
          indoorTempC: roundedTin,
          solarGainW: Math.round(Q_solar),
          internalGainW: Math.round(Q_internal),
          wallLossW: Math.round(Q_wall),
          roofLossW: Math.round(Q_roof),
          floorLossW: Math.round(Q_floor),
          windowLossW: Math.round(Q_window),
          ventilationLossW: Math.round(Q_vent),
          totalGainW: Math.round(totalGain),
          totalLossW: Math.round(totalLoss),
          netHeatFlowW: Math.round(netHeatFlow)
        });

        // Discrete-time ODE step: C * dTin/dt = netHeatFlow
        Tin += (netHeatFlow * dt) / C;
      }

      const avgIndoor = Math.round((sumIndoor / 24) * 10) / 10;
      const avgOutdoor = Math.round((sumOutdoor / 24) * 10) / 10;
      const totalHeatLossKWh = Math.round((totalLossJ / 3600000) * 10) / 10;
      const totalSolarGainKWh = Math.round((totalSolarJ / 3600000) * 10) / 10;

      const sumLosses = Math.max(1, sumWallLossW + sumRoofLossW + sumFloorLossW + sumWinLossW + sumVentLossW);
      const wallsPct = Math.round((sumWallLossW / sumLosses) * 100);
      const roofPct = Math.round((sumRoofLossW / sumLosses) * 100);
      const floorPct = Math.round((sumFloorLossW / sumLosses) * 100);
      const windowPct = Math.round((sumWinLossW / sumLosses) * 100);
      const ventilationPct = Math.max(0, 100 - (wallsPct + roofPct + floorPct + windowPct));

      return {
        minIndoorTempC: minIndoor,
        maxIndoorTempC: maxIndoor,
        avgIndoorTempC: avgIndoor,
        minOutdoorTempC: minOutdoor,
        maxOutdoorTempC: maxOutdoor,
        avgOutdoorTempC: avgOutdoor,
        totalHeatLossKWh,
        totalSolarGainKWh,
        maxHourlyHeatLossW: Math.round(maxHourlyLossW),
        geometry: { floorAreaM2: A_floor, volumeM3: V, grossWallAreaM2: A_wall_gross, opaqueWallAreaM2: A_wall, roofAreaM2: A_roof, windowAreaM2: A_window },
        envelopeUValues: {
          uWallWm2K: Math.round(U_wall * 1000) / 1000,
          uRoofWm2K: Math.round(U_roof * 1000) / 1000,
          uFloorWm2K: Math.round(U_floor * 1000) / 1000,
          uWindowWm2K: Math.round(U_window * 1000) / 1000
        },

        heatLossBreakdown: { wallsPct, roofPct, floorPct, windowPct, ventilationPct },

      };

    // ==========================================
    // PHASE 3 OPTIMIZATION ENGINE & CONFIG
    // ==========================================

    const OPTIMIZATION_CONFIG = {
      targetIndoorTempC: 15.0,
      minWindowWallRatio: 0.06,
      maxWindowWallRatio: 0.35,
      minIndoorTempConstraintC: -12.0,
      weights: {

        heatLoss: 0.25,
        temperatureStability: 0.15,
        solarGain: 0.15,
        heatingDemand: 0.20
      }
    };

    function calculateHeatingDemandProxy(sim, targetTempC = 15.0) {
      const geo = sim.geometry;
      const u = sim.envelopeUValues;
      const UA_envelope = u.uWallWm2K * geo.opaqueWallAreaM2 + u.uRoofWm2K * geo.roofAreaM2 + u.uFloorWm2K * geo.floorAreaM2 + u.uWindowWm2K * geo.windowAreaM2;
      let totalHeatingJoules = 0;
      for (const h of sim.hourlyData) {
        if (h.indoorTempC < targetTempC) {
          const deltaTDef = targetTempC - h.indoorTempC;
          const deltaTEnv = Math.max(0.1, h.indoorTempC - h.outdoorTempC);
          const ventCond = h.ventilationLossW > 0 ? h.ventilationLossW / deltaTEnv : 0;
          totalHeatingJoules += deltaTDef * (UA_envelope + ventCond) * 3600;
        }
      }
      return Math.round((totalHeatingJoules / 3600000) * 10) / 10;
    }

    function runDesignOptimization(baselineInputs) {
      const baselineSim = runDeterministicSimulation(baselineInputs);
      const baselineHeatProxy = calculateHeatingDemandProxy(baselineSim);
      const rawCandidates = generateCandidateConfigurations(baselineInputs);

      const intermediate = rawCandidates.map(c => {
        const sim = runDeterministicSimulation(c.inputs);
        const heatProxy = calculateHeatingDemandProxy(sim);
        const swing = Math.round((sim.maxIndoorTempC - sim.minIndoorTempC) * 10) / 10;
        const isFeasible = c.inputs.windowAreaM2 >= 0 && sim.minIndoorTempC >= OPTIMIZATION_CONFIG.minIndoorTempConstraintC;
        return { candidate: c, sim, heatProxy, swing, isFeasible };
      });

      const allPool = [
        { sim: baselineSim, heatProxy: baselineHeatProxy, swing: Math.round((baselineSim.maxIndoorTempC - baselineSim.minIndoorTempC) * 10) / 10 },
        ...intermediate.map(i => ({ sim: i.sim, heatProxy: i.heatProxy, swing: i.swing }))
      ];

      const minLoss = Math.min(...allPool.map(p => p.sim.totalHeatLossKWh));
      const maxLoss = Math.max(...allPool.map(p => p.sim.totalHeatLossKWh));
      const minSolar = Math.min(...allPool.map(p => p.sim.totalSolarGainKWh));
      const maxSolar = Math.max(...allPool.map(p => p.sim.totalSolarGainKWh));
      const minAvg = Math.min(...allPool.map(p => p.sim.avgIndoorTempC));
      const maxAvg = Math.max(...allPool.map(p => p.sim.avgIndoorTempC));
      const minMin = Math.min(...allPool.map(p => p.sim.minIndoorTempC));
      const maxMin = Math.max(...allPool.map(p => p.sim.minIndoorTempC));
      const minSwing = Math.min(...allPool.map(p => p.swing));
      const maxSwing = Math.max(...allPool.map(p => p.swing));
      const minReq = Math.min(...allPool.map(p => p.heatProxy));
      const maxReq = Math.max(...allPool.map(p => p.heatProxy));

      const w = OPTIMIZATION_CONFIG.weights;

      function calcScore(sim, swing, heatProxy) {
        const normAvg = (sim.avgIndoorTempC - minAvg) / Math.max(0.001, maxAvg - minAvg);
        const normMin = (sim.minIndoorTempC - minMin) / Math.max(0.001, maxMin - minMin);
        const condNorm = Math.max(0, Math.min(1, 0.5 * normAvg + 0.5 * normMin));
        const lossNorm = Math.max(0, Math.min(1, (maxLoss - sim.totalHeatLossKWh) / Math.max(0.001, maxLoss - minLoss)));
        const stabNorm = Math.max(0, Math.min(1, (maxSwing - swing) / Math.max(0.001, maxSwing - minSwing)));
        const solNorm = Math.max(0, Math.min(1, (sim.totalSolarGainKWh - minSolar) / Math.max(0.001, maxSolar - minSolar)));
        const heatNorm = Math.max(0, Math.min(1, (maxReq - heatProxy) / Math.max(0.001, maxReq - minReq)));

        const score = Math.round((w.thermalCondition * condNorm + w.heatLoss * lossNorm + w.temperatureStability * stabNorm + w.solarGain * solNorm + w.heatingDemand * heatNorm) * 1000) / 10;
        return { score, components: { thermalCondition: condNorm, heatLoss: lossNorm, temperatureStability: stabNorm, solarGain: solNorm, heatingDemand: heatNorm } };
      }

      function getReasoning(cSim, cInputs, cHeat) {
        const reasons = [];
        const dLoss = baselineSim.totalHeatLossKWh - cSim.totalHeatLossKWh;
        const pctLoss = Math.round((dLoss / Math.max(0.1, baselineSim.totalHeatLossKWh)) * 100);
        if (dLoss > 0.5) reasons.push(`Reduced envelope & infiltration heat loss by ${dLoss.toFixed(1)} kWh (-${pctLoss}%) compared with baseline.`);
        const dSolar = cSim.totalSolarGainKWh - baselineSim.totalSolarGainKWh;
        const pctSolar = Math.round((dSolar / Math.max(0.1, baselineSim.totalSolarGainKWh)) * 100);
        if (dSolar > 0.5) reasons.push(`Improved useful passive solar heat gain by ${dSolar.toFixed(1)} kWh (+${pctSolar}%) under ${cInputs.orientation} orientation.`);
        const bSwing = baselineSim.maxIndoorTempC - baselineSim.minIndoorTempC;
        const cSwing = cSim.maxIndoorTempC - cSim.minIndoorTempC;
        if (bSwing - cSwing > 0.5) reasons.push(`Improved indoor-temperature stability by dampening diurnal swing from ${bSwing.toFixed(1)}°C to ${cSwing.toFixed(1)}°C.`);
        const dMin = cSim.minIndoorTempC - baselineSim.minIndoorTempC;
        if (dMin > 0.5) reasons.push(`Elevated minimum overnight indoor temperature by +${dMin.toFixed(1)}°C (${baselineSim.minIndoorTempC}°C → ${cSim.minIndoorTempC}°C).`);
        const dHeat = baselineHeatProxy - cHeat;
        const pctHeat = Math.round((dHeat / Math.max(0.1, baselineHeatProxy)) * 100);
        if (dHeat > 0.5) reasons.push(`Lower estimated active-heating requirement in prototype model, saving ${dHeat.toFixed(1)} kWh/day (-${pctHeat}%).`);
        if (reasons.length === 0) reasons.push('Maintains balanced passive thermal characteristics relative to user baseline.');
        return reasons;
      }

      const baseScore = calcScore(baselineSim, Math.round((baselineSim.maxIndoorTempC - baselineSim.minIndoorTempC) * 10) / 10, baselineHeatProxy);
      const evaluatedBaseline = {
        id: 'baseline',
        rank: 0,
        name: 'User Design / Baseline',
        tagline: `Configured: ${baselineInputs.orientation}, ${WALL_MATERIALS[baselineInputs.wallMaterialId]?.name.split('(')[0]}`,
        inputs: baselineInputs,
        simulation: baselineSim,
        metrics: {
          totalHeatLossKWh: baselineSim.totalHeatLossKWh,
          totalSolarGainKWh: baselineSim.totalSolarGainKWh,
          minIndoorTempC: baselineSim.minIndoorTempC,
          maxIndoorTempC: baselineSim.maxIndoorTempC,
          avgIndoorTempC: baselineSim.avgIndoorTempC,
          diurnalSwingC: Math.round((baselineSim.maxIndoorTempC - baselineSim.minIndoorTempC) * 10) / 10,
          heatingDemandProxyKWh: baselineHeatProxy,
          overallScore: baseScore.score,
          scoreComponents: baseScore.components,
          isFeasible: true
        },
        isBaseline: true,
        isRecommended: false,
        recommendationReasoning: []
      };

      const evaluatedCandidates = intermediate.map(i => {
        const sc = calcScore(i.sim, i.swing, i.heatProxy);
        const reasoning = getReasoning(i.sim, i.candidate.inputs, i.heatProxy);
        return {
          id: i.candidate.id,
          rank: 0,
          name: i.candidate.name,
          tagline: i.candidate.tagline,
          inputs: i.candidate.inputs,
          simulation: i.sim,
          metrics: {
            totalHeatLossKWh: i.sim.totalHeatLossKWh,
            totalSolarGainKWh: i.sim.totalSolarGainKWh,
            minIndoorTempC: i.sim.minIndoorTempC,
            maxIndoorTempC: i.sim.maxIndoorTempC,
            avgIndoorTempC: i.sim.avgIndoorTempC,
            diurnalSwingC: i.swing,
            heatingDemandProxyKWh: i.heatProxy,
            overallScore: sc.score,
            scoreComponents: sc.components,
            isFeasible: i.isFeasible
          },
          isBaseline: false,
          isRecommended: false,
          recommendationReasoning: reasoning
        };
      });

      evaluatedCandidates.sort((a, b) => b.metrics.overallScore - a.metrics.overallScore);
      evaluatedCandidates.forEach((c, idx) => { c.rank = idx + 1; });
      const recommended = evaluatedCandidates[0];
      recommended.isRecommended = true;
      const top5 = evaluatedCandidates.slice(0, 5);

      return {
        baseline: evaluatedBaseline,
        candidates: evaluatedCandidates,
        recommended,
        top5,
        evaluatedCount: evaluatedCandidates.length,
        feasibleCount: evaluatedCandidates.length
      };
    }

    // ==========================================
    // 3. UI COMPONENTS
    // ==========================================
